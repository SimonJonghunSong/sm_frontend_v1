name: 프론트 배포

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest # 워크플로우 실행 환경을 지정

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/lib/nodejs/node-v22.11.0-linux-x64/bin
            npm cache clean --force
            cd /home/simon/sm_frontend_v1
            git pull https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ secrets.GH_USERNAME }}/sm_frontend_v1.git
            npm install
            npm run build
            fuser -k 3000/tcp || true
            pkill -f "npm start" || true
            sleep 2
            nohup npm start > output.log 2>&1 &
