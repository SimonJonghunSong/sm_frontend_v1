name: 프론트 배포

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3
        with:
        token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.11.0"

      - name: Install dependencies
        run: |
          cd /home/simon/stsunlab-sync-master
          npm install

      - name: Build Next.js app
        run: |
          cd /home/simon/stsunlab-sync-master
          npm run build

      - name: Start app with PM2
        run: |
          pm2 delete all || true # 이전 프로세스 종료
          pm2 start npm --name "next-app" -- start --prefix /home/simon/stsunlab-sync-master

      - name: PM2 process 자동 복구 설정
        run: |
          pm2 save
