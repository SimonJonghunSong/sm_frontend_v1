name: 프론트 배포

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest # 워크플로우 실행 환경을 지정

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/lib/nodejs/node-v22.11.0-linux-x64/bin
            npm cache clean --force
            cd /home/simon/stsunlab-sync-master
            if [ -f .env.local ]; then cp .env.local .env.local.backup; fi
            git reset --hard HEAD
            git pull https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ secrets.GH_USERNAME }}/stsunlab-sync-master.git
            if [ -f .env.local.backup ]; then cp .env.local.backup .env.local; fi
            npm install
            npm run build
            /home/simon/restart.sh
